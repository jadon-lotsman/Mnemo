services:
  db:
    image: postgres:17-alpine
    container_name: mnemo-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ./Mnemo.Api
      dockerfile: Dockerfile
    container_name: mnemo-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
    restart: unless-stopped

  vue:
    depends_on:
      - api
    build:
      context: ./Mnemo.Vue
      dockerfile: Dockerfile
    container_name: mnemo-vue
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
